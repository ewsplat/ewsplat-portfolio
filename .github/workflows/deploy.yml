name: EWSPLAT Pages Artifact

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the validated artifact to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Pin npm to the validated lockfile toolchain
        run: npm install --global npm@11.11.0
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run deploy:validate
      - name: Build staged production site
        run: npm run deploy:build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
          PUBLIC_EXTERNAL_MEDIA_PREFIXES: ${{ vars.PUBLIC_EXTERNAL_MEDIA_PREFIXES }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: ${{ inputs.publish == true }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
